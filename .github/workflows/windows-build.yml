name: Build Windows App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'editor.py'
      - 'requirements.txt'
      - '.github/workflows/windows-build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py editor.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name AI-RAW-Editor --collect-all rawpy app.py
      - uses: actions/upload-artifact@v4
        with:
          name: AI-RAW-Editor-Windows
          path: dist/AI-RAW-Editor.exe
          if-no-files-found: error
